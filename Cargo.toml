[package]
name = "life-game"
version = "0.1.0"
edition = "2021"
default-run = "life-game"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# https://github.com/rust-lang/cargo/issues/4897
[profile.wasm]
inherits = "release"
panic = "abort"
opt-level = 'z'
lto = true
codegen-units = 1

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.77", features = ["Window", "Location"] }
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
open = "5.3.2"

[dependencies]
rand = "0.8.5"
rand_xoshiro = "0.6.0"
chrono = "0.4.38"
unicode-segmentation = "1.11.0"
strum = "0.26.3"
strum_macros = "0.26.4"

bevy = "0.19.1"
bevy_asset_loader = { version = "0.27.0", features = ["2d", "standard_dynamic_assets"] }

noisy_bevy = "0.14.0"
bevy_tweening = { version = "0.16.0", features = ["bevy_ui"]}
bevy_yarnspinner = "0.9.0"
yarnspinner = "0.9.0"

serde_json = "1.0"

[dev-dependencies]
strsim = "0.11.1"

[workspace]

members = [ "dialogue_graph", "dialogue_lines", "map-bootstrapper" ]
